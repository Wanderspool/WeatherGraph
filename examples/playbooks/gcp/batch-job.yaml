# ==============================================================================
# WeatherGraph — GCP Batch Job
#
# Runs the complete forecast pipeline as a GCP Batch job on a fully-managed
# container. No persistent VM to manage — the job spins up, runs, and exits.
#
# Prerequisites
# ─────────────
#   gcloud services enable batch.googleapis.com storage.googleapis.com
#
# Submit
# ──────
#   gcloud batch jobs submit weathergraph-$(date +%Y%m%d%H%M) \
#     --location=us-central1 \
#     --config=gcp-batch-job.yaml
#
# Override model / forecast parameters at submit time
# ────────────────────────────────────────────────────
#   gcloud batch jobs submit weathergraph-$(date +%Y%m%d%H%M) \
#     --location=us-central1 \
#     --config=gcp-batch-job.yaml \
#     --env MODEL_URL=https://my-bucket.storage.googleapis.com/my_gnn.onnx \
#     --env INPUT_DATA=gs://my-bucket/era5/2024010100.nc \
#     --env OUTPUT_BUCKET=gs://my-bucket/forecasts \
#     --env STEPS=16 \
#     --env OUTPUT_FMT=zarr
# ==============================================================================

taskGroups:
  - taskSpec:
      runnables:
        - script:
            text: |
              #!/usr/bin/env bash
              set -euo pipefail

              WG_DIR="/opt/weathergraph"
              WG_VENV="$WG_DIR/.venv"
              MODEL_PATH="$WG_DIR/models/weather_gnn.onnx"

              # ── Environment variables with defaults ───────────────────────
              MODEL_SOURCE="${MODEL_SOURCE:-url}"
              MODEL_URL="${MODEL_URL:-https://huggingface.co/Wanderspool/Keisler_2022/resolve/main/keisler_2022.onnx}"
              MODEL_SCRIPT="${MODEL_SCRIPT:-}"
              MODEL_SCRIPT_ARGS="${MODEL_SCRIPT_ARGS:-}"
              MODEL_SCRIPT_PIP="${MODEL_SCRIPT_PIP:-}"
              INPUT_DATA="${INPUT_DATA:-}"
              OUTPUT_DIR="${OUTPUT_DIR:-/tmp/weathergraph_out}"
              OUTPUT_BUCKET="${OUTPUT_BUCKET:-}"
              STEPS="${STEPS:-40}"
              OUTPUT_FMT="${OUTPUT_FMT:-netcdf4}"
              T0="${T0:-}"
              INTRA_OP_THREADS="${INTRA_OP_THREADS:-1}"
              EXECUTION_PROVIDER="${EXECUTION_PROVIDER:-cpu}"
              EXECUTION_DEVICE_ID="${EXECUTION_DEVICE_ID:-0}"
              EXECUTION_MEMORY_LIMIT="${EXECUTION_MEMORY_LIMIT:-0}"
              EXECUTION_PROVIDER_OPTIONS="${EXECUTION_PROVIDER_OPTIONS:-}"
              DISABLE_CPU_EP_FALLBACK="${DISABLE_CPU_EP_FALLBACK:-false}"
              DISABLE_CPU_MEM_ARENA="${DISABLE_CPU_MEM_ARENA:-false}"
              DISABLE_MEM_PATTERN="${DISABLE_MEM_PATTERN:-false}"
              SPATIAL_TILING="${SPATIAL_TILING:-false}"
              TILE_BUNDLE_PATH="${TILE_BUNDLE_PATH:-}"
              REFERENCE_GRID_SHAPE="${REFERENCE_GRID_SHAPE:-}"
              REFERENCE_GRID_RESOLUTION_DEGREES="${REFERENCE_GRID_RESOLUTION_DEGREES:-}"
              TILE_STATE_BACKEND="${TILE_STATE_BACKEND:-ram}"
              TILE_STATE_DIR="${TILE_STATE_DIR:-}"
              DATA_SOURCE="${DATA_SOURCE:-era5_netcdf}"
              DATA_SOURCE_PARAMS="${DATA_SOURCE_PARAMS:-}"

              # ── 1. Dependencies ───────────────────────────────────────────
              apt-get update -qq
              apt-get install -y --no-install-recommends git cmake g++ curl python3 python3-pip python3-venv

              # ── 2. Clone engine ───────────────────────────────────────────
              git clone --depth=1 https://github.com/Wanderspool/WeatherGraph "$WG_DIR"
              cd "$WG_DIR"

              # ── 3. Python environment ─────────────────────────────────────
              python3 -m venv "$WG_VENV"
              "$WG_VENV/bin/pip" install --quiet --upgrade pip \
                "pybind11>=2.13.0" numpy xarray pandas dask netCDF4 zarr onnx

              # ── 4. ONNX Runtime ───────────────────────────────────────────
              make onnxruntime

              # ── 5. Build C++ backend ──────────────────────────────────────
              PYBIND11_CMAKE=$("$WG_VENV/bin/python" -c "import pybind11; print(pybind11.get_cmake_dir())")
              cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -Dpybind11_DIR="$PYBIND11_CMAKE"
              cmake --build build --parallel "$(nproc)"
              mkdir -p weathergraph/core
              cp build/weathergraph_backend.so weathergraph/core/
              cp onnxruntime-sdk/lib/libonnxruntime*.so* weathergraph/core/

              # ── 6. Acquire model ──────────────────────────────────────────
              mkdir -p "$(dirname "$MODEL_PATH")"
              if [ "$MODEL_SOURCE" = "url" ]; then
                curl -fSL "$MODEL_URL" --output "$MODEL_PATH"
              elif [ "$MODEL_SOURCE" = "script" ]; then
                [ -n "$MODEL_SCRIPT_PIP" ] && "$WG_VENV/bin/pip" install --quiet $MODEL_SCRIPT_PIP
                "$WG_VENV/bin/python" "$WG_DIR/$MODEL_SCRIPT" $MODEL_SCRIPT_ARGS --output "$MODEL_PATH"
              fi

              "$WG_VENV/bin/python" -c "
              import onnx; m = onnx.load('$MODEL_PATH');
              onnx.checker.check_model(m);
              print('[validate] OK opset', m.opset_import[0].version)"

              # ── 7. Run forecast ───────────────────────────────────────────
              if [ -n "$INPUT_DATA" ]; then
                INPUT_LOCAL="/tmp/wg_input.nc"
                [[ "$INPUT_DATA" == gs://* ]] && gsutil cp "$INPUT_DATA" "$INPUT_LOCAL" || INPUT_LOCAL="$INPUT_DATA"

                export LD_LIBRARY_PATH="$WG_DIR/weathergraph/core:$LD_LIBRARY_PATH"
                export PYTHONPATH="$WG_DIR"

                CLI_ARGS=(
                  -m weathergraph.cli forecast
                  --model-path "$MODEL_PATH"
                  --weights-dir "$WG_DIR/data"
                  --intra-op-threads "$INTRA_OP_THREADS"
                  --execution-provider "$EXECUTION_PROVIDER"
                  --execution-device-id "$EXECUTION_DEVICE_ID"
                  --execution-memory-limit "$EXECUTION_MEMORY_LIMIT"
                  --data-source "$DATA_SOURCE"
                  --steps "$STEPS"
                  --output-format "$OUTPUT_FMT"
                  --output-path "$OUTPUT_DIR"
                  --tile-state-backend "$TILE_STATE_BACKEND"
                )
                [[ "$DISABLE_CPU_EP_FALLBACK" == "true" ]] && CLI_ARGS+=(--disable-cpu-ep-fallback)
                [[ "$DISABLE_CPU_MEM_ARENA" == "true" ]] && CLI_ARGS+=(--disable-cpu-mem-arena)
                [[ "$DISABLE_MEM_PATTERN" == "true" ]] && CLI_ARGS+=(--disable-mem-pattern)
                [[ "$SPATIAL_TILING" == "true" ]] && CLI_ARGS+=(--spatial-tiling)
                [[ "$DATA_SOURCE" == "era5_netcdf" ]] && CLI_ARGS+=(--input-path "$INPUT_LOCAL")
                [[ -n "$EXECUTION_PROVIDER_OPTIONS" ]] && CLI_ARGS+=(--execution-provider-options "$EXECUTION_PROVIDER_OPTIONS")
                [[ -n "$TILE_BUNDLE_PATH" ]] && CLI_ARGS+=(--tile-bundle-path "$TILE_BUNDLE_PATH")
                [[ -n "$REFERENCE_GRID_SHAPE" ]] && CLI_ARGS+=(--reference-grid-shape "$REFERENCE_GRID_SHAPE")
                [[ -n "$REFERENCE_GRID_RESOLUTION_DEGREES" ]] && CLI_ARGS+=(--reference-grid-resolution-degrees "$REFERENCE_GRID_RESOLUTION_DEGREES")
                [[ -n "$TILE_STATE_DIR" ]] && CLI_ARGS+=(--tile-state-dir "$TILE_STATE_DIR")
                [[ -n "$DATA_SOURCE_PARAMS" && "$DATA_SOURCE" != "era5_netcdf" ]] && CLI_ARGS+=(--source-kwargs "$DATA_SOURCE_PARAMS")
                [[ -n "$T0" ]] && CLI_ARGS+=(--start-time "$T0")

                "$WG_VENV/bin/python" "${CLI_ARGS[@]}"

                [ -n "$OUTPUT_BUCKET" ] && gsutil -m cp -r "$OUTPUT_DIR/" "$OUTPUT_BUCKET/"
                echo "[wg] Done. Results at ${OUTPUT_BUCKET:-$OUTPUT_DIR}"
              fi

      environment:
        variables:
          MODEL_SOURCE:      "url"
          MODEL_URL:         "https://huggingface.co/Wanderspool/Keisler_2022/resolve/main/keisler_2022.onnx"
          MODEL_SCRIPT:      ""
          MODEL_SCRIPT_ARGS: ""
          MODEL_SCRIPT_PIP:  ""
          INPUT_DATA:        ""
          OUTPUT_DIR:        "/tmp/weathergraph_out"
          OUTPUT_BUCKET:     ""
          STEPS:             "40"
          OUTPUT_FMT:        "netcdf4"
          T0:                ""
          INTRA_OP_THREADS:  "1"
          EXECUTION_PROVIDER: "cpu"
          EXECUTION_DEVICE_ID: "0"
          EXECUTION_MEMORY_LIMIT: "0"
          EXECUTION_PROVIDER_OPTIONS: ""
          DISABLE_CPU_EP_FALLBACK: "false"
          DISABLE_CPU_MEM_ARENA: "false"
          DISABLE_MEM_PATTERN: "false"
          SPATIAL_TILING:    "false"
          TILE_BUNDLE_PATH:  ""
          REFERENCE_GRID_SHAPE: ""
          REFERENCE_GRID_RESOLUTION_DEGREES: ""
          TILE_STATE_BACKEND: "ram"
          TILE_STATE_DIR: ""
          DATA_SOURCE:       "era5_netcdf"
          DATA_SOURCE_PARAMS: ""

    taskCount: 1
    parallelism: 1

allocationPolicy:
  instances:
    - policy:
        machineType: e2-standard-2
        # Use spot VMs to minimize cost — remove for guaranteed capacity
        provisioningModel: SPOT

logsPolicy:
  destination: CLOUD_LOGGING
