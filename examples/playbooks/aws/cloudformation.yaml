# ==============================================================================
# WeatherGraph — AWS Batch Job Definition (CloudFormation)
#
# Deploys a complete AWS Batch environment (compute environment, job queue,
# job definition) and a Lambda-backed custom resource that submits the first
# forecast job on stack creation.
#
# Prerequisites
# ─────────────
#   aws iam create-role --role-name WeatherGraphBatchRole \
#     --assume-role-policy-document file://batch-trust-policy.json
#   aws iam attach-role-policy --role-name WeatherGraphBatchRole \
#     --policy-arn arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole
#
# Deploy
# ──────
#   aws cloudformation deploy \
#     --template-file aws-batch.yaml \
#     --stack-name weathergraph \
#     --capabilities CAPABILITY_NAMED_IAM
#
# Submit a job with custom parameters
# ────────────────────────────────────
#   aws batch submit-job \
#     --job-name weathergraph-$(date +%Y%m%d%H%M) \
#     --job-queue WeatherGraphQueue \
#     --job-definition WeatherGraphJob \
#     --container-overrides '{
#         "environment": [
#           {"name": "MODEL_URL",      "value": "https://my-server/my_gnn.onnx"},
#           {"name": "INPUT_DATA",     "value": "s3://my-bucket/era5/2024010100.nc"},
#           {"name": "OUTPUT_BUCKET",  "value": "s3://my-bucket/forecasts"},
#           {"name": "STEPS",          "value": "16"},
#           {"name": "OUTPUT_FMT",     "value": "zarr"}
#         ]
#       }'
# ==============================================================================

AWSTemplateFormatVersion: "2010-09-09"
Description: WeatherGraph — AWS Batch forecast pipeline

Parameters:
  InstanceType:
    Type:    String
    Default: "c5.xlarge"
    Description: EC2 instance type for Batch compute (4 vCPU / 8 GB RAM)

  ModelURL:
    Type:    String
    Default: "https://huggingface.co/Wanderspool/Keisler_2022/resolve/main/keisler_2022.onnx"

  InputData:
    Type:    String
    Default: ""
    Description: "s3:// URI to the ERA5 initial state NetCDF (leave empty to skip inference)"

  OutputBucket:
    Type:    String
    Default: ""
    Description: "s3:// URI prefix to upload results (leave empty to keep on instance)"

  Steps:
    Type:    Number
    Default: 40

  OutputFmt:
    Type:    String
    Default: "netcdf4"
    AllowedValues: [netcdf4, zarr, npz]

  DataSource:
    Type:    String
    Default: "era5_netcdf"
    Description: |
      Data-source adapter: era5_netcdf (default) | ecmwf_open | cds_era5 |
      gfs | open_meteo | custom

  DataSourceParams:
    Type:    String
    Default: ""
    Description: |
      JSON kwargs for the chosen adapter. Leave empty for era5_netcdf.
      Example cds_era5: '{"date":"2024-01-01","time":"00:00"}'
      Example custom:   '{"source":"my.nc","variable_map":{"z":"geopotential"}}'

Resources:
  # ── IAM ──────────────────────────────────────────────────────────────────────
  BatchInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: WeatherGraphInstanceRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  BatchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref BatchInstanceRole]

  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: WeatherGraphBatchServiceRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: batch.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: WeatherGraphJobRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  # ── Compute environment ───────────────────────────────────────────────────────
  ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: WeatherGraphCompute
      Type: MANAGED
      State: ENABLED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type:            SPOT          # use ON_DEMAND for guaranteed capacity
        BidPercentage:   60
        MinvCpus:        0
        MaxvCpus:        16
        InstanceRole:    !GetAtt BatchInstanceProfile.Arn
        InstanceTypes:   [!Ref InstanceType]
        Subnets:         !Split [",", !ImportValue DefaultVPCSubnets]
        SecurityGroupIds: [!ImportValue DefaultSecurityGroup]

  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: WeatherGraphQueue
      State:        ENABLED
      Priority:     1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironment

  # ── Job definition ────────────────────────────────────────────────────────────
  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: WeatherGraphJob
      Type:              container
      RetryStrategy:     {Attempts: 1}
      Timeout:           {AttemptDurationSeconds: 7200}
      ContainerProperties:
        Image:       debian:12
        Vcpus:       4
        Memory:      7680
        JobRoleArn:  !GetAtt BatchJobRole.Arn
        Command:
          - /bin/bash
          - -c
          - |
            set -euo pipefail
            WG_DIR=/opt/weathergraph
            WG_VENV=$WG_DIR/.venv
            MODEL_PATH=$WG_DIR/models/weather_gnn.onnx

            apt-get update -qq
            apt-get install -y --no-install-recommends git cmake g++ curl python3 python3-pip python3-venv

            git clone --depth=1 https://github.com/Wanderspool/WeatherGraph $WG_DIR
            cd $WG_DIR

            python3 -m venv $WG_VENV
            $WG_VENV/bin/pip install --quiet --upgrade pip \
              "pybind11>=2.13.0" numpy xarray pandas dask netCDF4 zarr onnx

            make onnxruntime
            PYBIND11_CMAKE=$($WG_VENV/bin/python -c "import pybind11; print(pybind11.get_cmake_dir())")
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -Dpybind11_DIR="$PYBIND11_CMAKE"
            cmake --build build --parallel $(nproc)
            mkdir -p weathergraph/core
            cp build/weathergraph_backend.so weathergraph/core/
            cp onnxruntime-sdk/lib/libonnxruntime.so* weathergraph/core/

            mkdir -p $(dirname $MODEL_PATH)
            curl -fSL "$MODEL_URL" --output $MODEL_PATH
            $WG_VENV/bin/python -c "import onnx; m=onnx.load('$MODEL_PATH'); onnx.checker.check_model(m)"

            if [ -n "$INPUT_DATA" ]; then
              INPUT_LOCAL=/tmp/wg_input.nc
              aws s3 cp "$INPUT_DATA" $INPUT_LOCAL

              export LD_LIBRARY_PATH=$WG_DIR/weathergraph/core:$LD_LIBRARY_PATH
              export PYTHONPATH=$WG_DIR
              $WG_VENV/bin/python -c "
            import json, xarray as xr
            from weathergraph import WeatherGraphModel
            from weathergraph.data_sources import load_source
            model = WeatherGraphModel(model_path='$MODEL_PATH', weights_dir='$WG_DIR/data')
            _src  = '$DATA_SOURCE' or 'era5_netcdf'
            _prms = '$DATA_SOURCE_PARAMS'
            if _src == 'era5_netcdf':
                adapter = load_source('era5_netcdf', path='$INPUT_LOCAL')
            elif _prms:
                adapter = load_source(_src, **json.loads(_prms))
            else:
                adapter = load_source(_src)
            kw = dict(steps=int('$STEPS'), output_path='/tmp/wg_out', fmt='$OUTPUT_FMT')
            if '$T0': kw['t0'] = '$T0'
            model.forecast_export(adapter, **kw)
            "
              [ -n "$OUTPUT_BUCKET" ] && aws s3 sync /tmp/wg_out/ "$OUTPUT_BUCKET/"
            fi

        Environment:
          - {Name: MODEL_SOURCE,      Value: "url"}
          - {Name: MODEL_URL,         Value: !Ref ModelURL}
          - {Name: MODEL_SCRIPT,      Value: ""}
          - {Name: MODEL_SCRIPT_ARGS, Value: ""}
          - {Name: MODEL_SCRIPT_PIP,  Value: ""}
          - {Name: INPUT_DATA,        Value: !Ref InputData}
          - {Name: OUTPUT_BUCKET,     Value: !Ref OutputBucket}
          - {Name: STEPS,             Value: !Sub "${Steps}"}
          - {Name: OUTPUT_FMT,        Value: !Ref OutputFmt}
          - {Name: T0,                Value: ""}
          - {Name: DATA_SOURCE,       Value: !Ref DataSource}
          - {Name: DATA_SOURCE_PARAMS,Value: !Ref DataSourceParams}

Outputs:
  JobQueue:
    Value:       !Ref JobQueue
    Description: Submit jobs to this queue
    Export:
      Name: WeatherGraphJobQueue

  JobDefinition:
    Value:       !Ref JobDefinition
    Description: Job definition ARN
    Export:
      Name: WeatherGraphJobDefinition
