[build-system]
requires = ["scikit-build-core>=0.10.0", "pybind11>=2.13.0"]
build-backend = "scikit_build_core.build"

[project]
name = "weathergraph"
version = "0.1.0"
description = "Universal high-performance C++/ONNX engine for graph-based weather models"
readme = "README.md"
authors = [{ name = "WeatherGraph Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "xarray>=2023.0.0",
    "pandas>=2.0.0",
    "dask>=2023.0.0",
    "netCDF4>=1.6.0",
    "zarr>=2.16.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "psutil>=5.9.0",
    "memory-profiler>=0.61.0"
]
vis = [
    "folium>=0.14.0",
    "matplotlib>=3.7.0",
    "imageio>=2.30.0",
    "imageio[ffmpeg]>=2.30.0"
]
metpy = [
    "metpy>=1.5.0"
]
xcdat = [
    "xcdat>=0.6.0"
]
climate = [
    "metpy>=1.5.0",
    "xcdat>=0.6.0",
    "xesmf>=0.8.0"
]
cloud = [
    "s3fs>=2023.0.0",
    "gcsfs>=2023.0.0"
]

[project.scripts]
weathergraph = "weathergraph.cli:main"

[tool.scikit-build]
cmake.args = ["-DCMAKE_BUILD_TYPE=Release"]
wheel.expand-macos-universal-tags = true
install.components = ["python_modules"]
