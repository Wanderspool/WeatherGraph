# ==============================================================================
# WeatherGraph — Scientist Playbook Template
#
# Copy this file to .github/workflows/validate-my-model.yml in YOUR repository.
# Uncomment the job that matches how your model is stored and customize the
# parameters in the "Configure" block.
#
# All four options use the same reusable pipeline — the engine build, ONNX
# Runtime setup, and test execution are handled automatically.
# ==============================================================================
name: Validate My Weather Model

on:
  workflow_dispatch:
  push:
    paths:
      - 'models/**'
      - 'scripts/export_*.py'
      - 'checkpoints/**'

jobs:

  # ============================================================================
  # OPTION A — Pre-built ONNX from any URL
  #
  # Works with HuggingFace, S3, your own HTTP server, or GitHub Releases.
  # Nothing else needed in your repo.
  # ============================================================================
  validate-from-url:
    name: Validate pre-built ONNX
    uses: Wanderspool/WeatherGraph/.github/workflows/model-pipeline.yml@main
    with:
      model-source: onnx
      # ── Configure ────────────────────────────────────────────────────────────
      model-url: 'https://huggingface.co/Wanderspool/Keisler_2022/resolve/main/keisler_2022.onnx'
      # Optional runtime knobs for low-memory runs:
      # intra-op-threads: 1
      # disable-cpu-mem-arena: true
      # disable-mem-pattern: true
      # spatial-tiling: true
      # tile-bundle-path: 'tile_bundle/manifest.json'
      # Other examples:
      #   model-url: 'https://my-bucket.s3.amazonaws.com/models/my_gnn.onnx'
      #   model-url: 'https://github.com/MyOrg/MyRepo/releases/download/v1.0/model.onnx'
      # ─────────────────────────────────────────────────────────────────────────

  # ============================================================================
  # OPTION B — Convert from PyTorch (torch.onnx.export)
  #
  # Your script (scripts/export_pytorch.py) must accept --output <path> and
  # write a valid ONNX file there. Minimal template:
  #
  #   import argparse, torch
  #   from my_package import MyGNN
  #
  #   parser = argparse.ArgumentParser()
  #   parser.add_argument('--checkpoint', required=True)
  #   parser.add_argument('--output', required=True)
  #   args = parser.parse_args()
  #
  #   model = MyGNN()
  #   model.load_state_dict(torch.load(args.checkpoint, map_location='cpu'))
  #   model.eval()
  #
  #   dummy = torch.zeros(1, n_nodes, 78)
  #   torch.onnx.export(
  #       model, dummy, args.output, opset_version=17,
  #       input_names=['input'], output_names=['output'],
  #       dynamic_axes={'input': {0: 'batch'}, 'output': {0: 'batch'}},
  #   )
  # ============================================================================
  # validate-pytorch:
  #   name: Validate PyTorch model
  #   uses: Wanderspool/WeatherGraph/.github/workflows/model-pipeline.yml@main
  #   with:
  #     model-source: script
  #     # ── Configure ──────────────────────────────────────────────────────────
  #     model-script: 'scripts/export_pytorch.py'
  #     model-script-args: '--checkpoint checkpoints/my_model.pt'
  #     model-pip-requirements: 'torch==2.3.0'
  #     # ───────────────────────────────────────────────────────────────────────

  # ============================================================================
  # OPTION C — Build the prototype latent-output graph from the repo's extractor scripts
  #
  # Uses exporter/build_gnn_graph.py which reads data/weights/*.npy and
  # data/graph_data/ (both Git LFS objects, checked out automatically).
  # This path is for graph-construction experiments only: it emits a prototype
  # latent-output ONNX graph and is not compatible with WeatherGraphModel
  # autoregressive inference unless you explicitly allow prototype exporters.
  # ============================================================================
  # validate-reference-built:
  #   name: Validate prototype latent-output graph
  #   uses: Wanderspool/WeatherGraph/.github/workflows/model-pipeline.yml@main
  #   with:
  #     model-source: script
  #     model-script: 'exporter/build_gnn_graph.py'
  #     model-pip-requirements: 'numpy onnx onnxscript'
  #     allow-prototype-exporter: true
  #     disable-cpu-mem-arena: true
  #     disable-mem-pattern: true

  # ============================================================================
  # OPTION D — Convert from TensorFlow / Keras (tf2onnx)
  #
  # Wrap tf2onnx in a small script that accepts --output:
  #
  #   import argparse, subprocess, sys
  #   parser = argparse.ArgumentParser()
  #   parser.add_argument('--saved-model', required=True)
  #   parser.add_argument('--output', required=True)
  #   args = parser.parse_args()
  #   subprocess.run([
  #       sys.executable, '-m', 'tf2onnx.convert',
  #       '--saved-model', args.saved_model,
  #       '--output', args.output,
  #       '--opset', '17',
  #   ], check=True)
  # ============================================================================
  # validate-tensorflow:
  #   name: Validate TensorFlow model
  #   uses: Wanderspool/WeatherGraph/.github/workflows/model-pipeline.yml@main
  #   with:
  #     model-source: script
  #     # ── Configure ──────────────────────────────────────────────────────────
  #     model-script: 'scripts/export_tensorflow.py'
  #     model-script-args: '--saved-model models/my_saved_model'
  #     model-pip-requirements: 'tensorflow tf2onnx'
  #     # ───────────────────────────────────────────────────────────────────────

# ==============================================================================
# DATA SOURCE CONFIGURATION
#
# All jobs above accept optional data-source inputs that control how the engine
# reads its initial atmospheric state.  Append these under the `with:` block
# of any job to override the default (ERA5 local NetCDF).
#
# ── Available sources ──────────────────────────────────────────────────────────
#
#   data-source: era5_netcdf    (default)  local ERA5 NetCDF file
#   data-source: ecmwf_open               ECMWF free real-time forecast
#   data-source: cds_era5                 Copernicus CDS reanalysis (API key)
#   data-source: gfs                      NOAA GFS via AWS Open Data
#   data-source: open_meteo               Open-Meteo free API (single point)
#   data-source: custom                   custom file / variable mapping
#
# ── Example: ERA5 from local file (default) ────────────────────────────────────
#
#   with:
#     model-url: '...'
#     data-source: era5_netcdf
#     data-source-params: '{"path": "data/era5_archives/init_state.nc"}'
#
# ── Example: ECMWF Open Data (free) ───────────────────────────────────────────
#
#   with:
#     model-url: '...'
#     data-source: ecmwf_open
#     data-source-params: '{"date": "2024-01-01", "step": 0}'
#
# ── Example: Copernicus CDS (requires CDSAPI_KEY secret) ──────────────────────
#
#   with:
#     model-url: '...'
#     data-source: cds_era5
#     data-source-params: '{"date": "2024-01-01", "time": "00:00"}'
#   secrets:
#     CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
#
# ── Example: NOAA GFS via AWS Open Data (free) ────────────────────────────────
#
#   with:
#     model-url: '...'
#     data-source: gfs
#     data-source-params: '{"date": "2024-01-01 00:00", "fxx": 0}'
#
# ── Example: Custom file with renamed variables ────────────────────────────────
#
#   with:
#     model-url: '...'
#     data-source: custom
#     data-source-params: |
#       {
#         "source": "data/my_nwp_output.nc",
#         "variable_map": {
#           "z": "geopotential",
#           "q": "specific_humidity",
#           "t": "air_temperature",
#           "u": "eastward_wind",
#           "v": "northward_wind",
#           "w": "vertical_velocity"
#         },
#         "level_dim": "pressure",
#         "lat_dim": "lat",
#         "lon_dim": "lon"
#       }
# ==============================================================================
