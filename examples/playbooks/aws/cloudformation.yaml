# ==============================================================================
# WeatherGraph — AWS Batch Job Definition (CloudFormation)
#
# Deploys a complete AWS Batch environment (compute environment, job queue,
# job definition) and a Lambda-backed custom resource that submits the first
# forecast job on stack creation.
#
# Prerequisites
# ─────────────
#   aws iam create-role --role-name WeatherGraphBatchRole \
#     --assume-role-policy-document file://batch-trust-policy.json
#   aws iam attach-role-policy --role-name WeatherGraphBatchRole \
#     --policy-arn arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole
#
# Deploy
# ──────
#   aws cloudformation deploy \
#     --template-file aws-batch.yaml \
#     --stack-name weathergraph \
#     --capabilities CAPABILITY_NAMED_IAM
#
# Submit a job with custom parameters
# ────────────────────────────────────
#   aws batch submit-job \
#     --job-name weathergraph-$(date +%Y%m%d%H%M) \
#     --job-queue WeatherGraphQueue \
#     --job-definition WeatherGraphJob \
#     --container-overrides '{
#         "environment": [
#           {"name": "MODEL_URL",      "value": "https://my-server/my_gnn.onnx"},
#           {"name": "INPUT_DATA",     "value": "s3://my-bucket/era5/2024010100.nc"},
#           {"name": "OUTPUT_BUCKET",  "value": "s3://my-bucket/forecasts"},
#           {"name": "STEPS",          "value": "16"},
#           {"name": "OUTPUT_FMT",     "value": "zarr"},
#           {"name": "EXECUTION_PROVIDER",    "value": "cuda"},
#           {"name": "EXECUTION_DEVICE_ID",   "value": "0"},
#           {"name": "EXECUTION_MEMORY_LIMIT", "value": "8589934592"},
#           {"name": "EXECUTION_PROVIDER_OPTIONS", "value": "{\"trt_engine_cache_enable\": true}"},
#           {"name": "DISABLE_CPU_EP_FALLBACK", "value": "true"},
#           {"name": "DISABLE_CPU_MEM_ARENA", "value": "true"},
#           {"name": "DISABLE_MEM_PATTERN",   "value": "true"},
#           {"name": "SPATIAL_TILING",        "value": "true"},
#           {"name": "TILE_BUNDLE_PATH",      "value": "/opt/weathergraph/tile_bundle/manifest.json"},
#           {"name": "REFERENCE_GRID_RESOLUTION_DEGREES", "value": "0.1"},
#           {"name": "TILE_STATE_BACKEND",    "value": "memmap"}
#         ]
#       }'
# ==============================================================================

AWSTemplateFormatVersion: "2010-09-09"
Description: WeatherGraph — AWS Batch forecast pipeline

Parameters:
  InstanceType:
    Type:    String
    Default: "c5.xlarge"
    Description: EC2 instance type for Batch compute (4 vCPU / 8 GB RAM)

  ModelURL:
    Type:    String
    Default: "https://huggingface.co/Wanderspool/Keisler_2022/resolve/main/keisler_2022.onnx"

  InputData:
    Type:    String
    Default: ""
    Description: "s3:// URI to the ERA5 initial state NetCDF (leave empty to skip inference)"

  OutputBucket:
    Type:    String
    Default: ""
    Description: "s3:// URI prefix to upload results (leave empty to keep on instance)"

  Steps:
    Type:    Number
    Default: 40

  OutputFmt:
    Type:    String
    Default: "netcdf4"
    AllowedValues: [netcdf4, zarr, npz]

  IntraOpThreads:
    Type:    Number
    Default: 1
    Description: ONNX Runtime intra-op thread count

  ExecutionProvider:
    Type:    String
    Default: "cpu"
    AllowedValues: [cpu, cuda, tensorrt, rocm, openvino]
    Description: Preferred ONNX Runtime execution provider

  ExecutionDeviceId:
    Type:    Number
    Default: 0
    Description: Accelerator device ordinal when ExecutionProvider is not cpu

  ExecutionMemoryLimit:
    Type:    Number
    Default: 0
    Description: Provider memory cap in bytes (0 keeps ONNX Runtime default)

  ExecutionProviderOptions:
    Type:    String
    Default: ""
    Description: JSON object string forwarded to the selected execution provider

  DisableCpuEpFallback:
    Type:    String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Fail session creation if CUDA placement falls back to CPU

  DisableCpuMemArena:
    Type:    String
    Default: "false"
    AllowedValues: ["true", "false"]

  DisableMemPattern:
    Type:    String
    Default: "false"
    AllowedValues: ["true", "false"]

  SpatialTiling:
    Type:    String
    Default: "false"
    AllowedValues: ["true", "false"]

  TileBundlePath:
    Type:    String
    Default: ""
    Description: Path to a tile-bundle manifest or directory on the job host

  ReferenceGridShape:
    Type:    String
    Default: ""
    Description: Optional export/reference-grid shape as LATxLON

  ReferenceGridResolutionDegrees:
    Type:    String
    Default: ""
    Description: Optional regular global reference-grid resolution in degrees

  TileStateBackend:
    Type:    String
    Default: "ram"
    AllowedValues: [ram, memmap]
    Description: Backend used for global tiled-state buffers

  TileStateDir:
    Type:    String
    Default: ""
    Description: Optional directory for memmap-backed tiled-state buffers

  DataSource:
    Type:    String
    Default: "era5_netcdf"
    Description: |
      Data-source adapter: era5_netcdf (default) | ecmwf_open | cds_era5 |
      gfs | open_meteo | custom

  DataSourceParams:
    Type:    String
    Default: ""
    Description: |
      JSON kwargs for the chosen adapter. Leave empty for era5_netcdf.
      Example cds_era5: '{"date":"2024-01-01","time":"00:00"}'
      Example custom:   '{"source":"my.nc","variable_map":{"z":"geopotential"}}'

Resources:
  # ── IAM ──────────────────────────────────────────────────────────────────────
  BatchInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: WeatherGraphInstanceRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  BatchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref BatchInstanceRole]

  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: WeatherGraphBatchServiceRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: batch.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: WeatherGraphJobRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  # ── Compute environment ───────────────────────────────────────────────────────
  ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: WeatherGraphCompute
      Type: MANAGED
      State: ENABLED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type:            SPOT          # use ON_DEMAND for guaranteed capacity
        BidPercentage:   60
        MinvCpus:        0
        MaxvCpus:        16
        InstanceRole:    !GetAtt BatchInstanceProfile.Arn
        InstanceTypes:   [!Ref InstanceType]
        Subnets:         !Split [",", !ImportValue DefaultVPCSubnets]
        SecurityGroupIds: [!ImportValue DefaultSecurityGroup]

  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: WeatherGraphQueue
      State:        ENABLED
      Priority:     1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironment

  # ── Job definition ────────────────────────────────────────────────────────────
  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: WeatherGraphJob
      Type:              container
      RetryStrategy:     {Attempts: 1}
      Timeout:           {AttemptDurationSeconds: 7200}
      ContainerProperties:
        Image:       debian:12
        Vcpus:       4
        Memory:      7680
        JobRoleArn:  !GetAtt BatchJobRole.Arn
        Command:
          - /bin/bash
          - -c
          - |
            set -euo pipefail
            WG_DIR=/opt/weathergraph
            WG_VENV=$WG_DIR/.venv
            MODEL_PATH=$WG_DIR/models/weather_gnn.onnx

            apt-get update -qq
            apt-get install -y --no-install-recommends git cmake g++ curl python3 python3-pip python3-venv

            git clone --depth=1 https://github.com/Wanderspool/WeatherGraph $WG_DIR
            cd $WG_DIR

            python3 -m venv $WG_VENV
            $WG_VENV/bin/pip install --quiet --upgrade pip \
              "pybind11>=2.13.0" numpy xarray pandas dask netCDF4 zarr onnx

            make onnxruntime
            PYBIND11_CMAKE=$($WG_VENV/bin/python -c "import pybind11; print(pybind11.get_cmake_dir())")
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -Dpybind11_DIR="$PYBIND11_CMAKE"
            cmake --build build --parallel $(nproc)
            mkdir -p weathergraph/core
            cp build/weathergraph_backend.so weathergraph/core/
            cp onnxruntime-sdk/lib/libonnxruntime*.so* weathergraph/core/

            mkdir -p $(dirname $MODEL_PATH)
            curl -fSL "$MODEL_URL" --output $MODEL_PATH
            $WG_VENV/bin/python -c "import onnx; m=onnx.load('$MODEL_PATH'); onnx.checker.check_model(m)"

            if [ -n "$INPUT_DATA" ]; then
              INPUT_LOCAL=/tmp/wg_input.nc
              aws s3 cp "$INPUT_DATA" $INPUT_LOCAL

              export LD_LIBRARY_PATH=$WG_DIR/weathergraph/core:$LD_LIBRARY_PATH
              export PYTHONPATH=$WG_DIR
              CLI_ARGS=(
                -m weathergraph.cli forecast
                --model-path "$MODEL_PATH"
                --weights-dir "$WG_DIR/data"
                --intra-op-threads "${INTRA_OP_THREADS:-1}"
                --execution-provider "${EXECUTION_PROVIDER:-cpu}"
                --execution-device-id "${EXECUTION_DEVICE_ID:-0}"
                --execution-memory-limit "${EXECUTION_MEMORY_LIMIT:-0}"
                --data-source "$DATA_SOURCE"
                --steps "$STEPS"
                --output-format "$OUTPUT_FMT"
                --output-path "/tmp/wg_out"
                --tile-state-backend "${TILE_STATE_BACKEND:-ram}"
              )
              [[ "${DISABLE_CPU_EP_FALLBACK:-false}" == "true" ]] && CLI_ARGS+=(--disable-cpu-ep-fallback)
              [[ "${DISABLE_CPU_MEM_ARENA:-false}" == "true" ]] && CLI_ARGS+=(--disable-cpu-mem-arena)
              [[ "${DISABLE_MEM_PATTERN:-false}" == "true" ]] && CLI_ARGS+=(--disable-mem-pattern)
              [[ "${SPATIAL_TILING:-false}" == "true" ]] && CLI_ARGS+=(--spatial-tiling)
              [[ "$DATA_SOURCE" == "era5_netcdf" ]] && CLI_ARGS+=(--input-path "$INPUT_LOCAL")
              [[ -n "${EXECUTION_PROVIDER_OPTIONS:-}" ]] && CLI_ARGS+=(--execution-provider-options "${EXECUTION_PROVIDER_OPTIONS}")
              [[ -n "${TILE_BUNDLE_PATH:-}" ]] && CLI_ARGS+=(--tile-bundle-path "${TILE_BUNDLE_PATH}")
              [[ -n "${REFERENCE_GRID_SHAPE:-}" ]] && CLI_ARGS+=(--reference-grid-shape "${REFERENCE_GRID_SHAPE}")
              [[ -n "${REFERENCE_GRID_RESOLUTION_DEGREES:-}" ]] && CLI_ARGS+=(--reference-grid-resolution-degrees "${REFERENCE_GRID_RESOLUTION_DEGREES}")
              [[ -n "${TILE_STATE_DIR:-}" ]] && CLI_ARGS+=(--tile-state-dir "${TILE_STATE_DIR}")
              [[ -n "$DATA_SOURCE_PARAMS" && "$DATA_SOURCE" != "era5_netcdf" ]] && CLI_ARGS+=(--source-kwargs "$DATA_SOURCE_PARAMS")
              [[ -n "$T0" ]] && CLI_ARGS+=(--start-time "$T0")
              $WG_VENV/bin/python "${CLI_ARGS[@]}"
              [ -n "$OUTPUT_BUCKET" ] && aws s3 sync /tmp/wg_out/ "$OUTPUT_BUCKET/"
            fi

        Environment:
          - {Name: MODEL_SOURCE,      Value: "url"}
          - {Name: MODEL_URL,         Value: !Ref ModelURL}
          - {Name: MODEL_SCRIPT,      Value: ""}
          - {Name: MODEL_SCRIPT_ARGS, Value: ""}
          - {Name: MODEL_SCRIPT_PIP,  Value: ""}
          - {Name: INPUT_DATA,        Value: !Ref InputData}
          - {Name: OUTPUT_BUCKET,     Value: !Ref OutputBucket}
          - {Name: STEPS,             Value: !Sub "${Steps}"}
          - {Name: OUTPUT_FMT,        Value: !Ref OutputFmt}
          - {Name: INTRA_OP_THREADS,  Value: !Sub "${IntraOpThreads}"}
          - {Name: EXECUTION_PROVIDER, Value: !Ref ExecutionProvider}
          - {Name: EXECUTION_DEVICE_ID, Value: !Sub "${ExecutionDeviceId}"}
          - {Name: EXECUTION_MEMORY_LIMIT, Value: !Sub "${ExecutionMemoryLimit}"}
          - {Name: EXECUTION_PROVIDER_OPTIONS, Value: !Ref ExecutionProviderOptions}
          - {Name: DISABLE_CPU_EP_FALLBACK, Value: !Ref DisableCpuEpFallback}
          - {Name: DISABLE_CPU_MEM_ARENA, Value: !Ref DisableCpuMemArena}
          - {Name: DISABLE_MEM_PATTERN, Value: !Ref DisableMemPattern}
          - {Name: SPATIAL_TILING,    Value: !Ref SpatialTiling}
          - {Name: TILE_BUNDLE_PATH,  Value: !Ref TileBundlePath}
          - {Name: REFERENCE_GRID_SHAPE, Value: !Ref ReferenceGridShape}
          - {Name: REFERENCE_GRID_RESOLUTION_DEGREES, Value: !Ref ReferenceGridResolutionDegrees}
          - {Name: TILE_STATE_BACKEND, Value: !Ref TileStateBackend}
          - {Name: TILE_STATE_DIR, Value: !Ref TileStateDir}
          - {Name: T0,                Value: ""}
          - {Name: DATA_SOURCE,       Value: !Ref DataSource}
          - {Name: DATA_SOURCE_PARAMS,Value: !Ref DataSourceParams}

Outputs:
  JobQueue:
    Value:       !Ref JobQueue
    Description: Submit jobs to this queue
    Export:
      Name: WeatherGraphJobQueue

  JobDefinition:
    Value:       !Ref JobDefinition
    Description: Job definition ARN
    Export:
      Name: WeatherGraphJobDefinition
