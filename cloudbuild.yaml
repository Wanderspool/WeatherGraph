# =============================================================================
# GCP Cloud Build — WeatherGraph CI/CD Pipeline
#
# Triggered on: push to any branch (configure in Cloud Build trigger settings)
# Required GCP APIs: Cloud Build, Artifact Registry
#
# One-time setup:
#   1. Enable APIs:
#        gcloud services enable cloudbuild.googleapis.com artifactregistry.googleapis.com
#
#   2. Create Artifact Registry repository:
#        gcloud artifacts repositories create weathergraph \
#          --repository-format=docker \
#          --location=us-central1
#
#   3. Grant Cloud Build SA access to Artifact Registry:
#        gcloud projects add-iam-policy-binding $PROJECT_ID \
#          --member="serviceAccount:$PROJECT_NUMBER@cloudbuild.gserviceaccount.com" \
#          --role="roles/artifactregistry.writer"
#
#   4. Connect GitHub repo and create trigger in the Cloud Build console,
#      or via gcloud:
#        gcloud builds triggers create github \
#          --repo-name=weathergraph \
#          --repo-owner=<org> \
#          --branch-pattern="^main$" \
#          --build-config=cloudbuild.yaml
#
# Substitution variables (override in trigger or --substitutions flag):
#   _REGION  : Artifact Registry region   (default: us-central1)
#   _REPO    : Artifact Registry repo name (default: weathergraph)
#   _IMAGE   : Docker image name           (default: weathergraph)
# =============================================================================

steps:
  # ─── Step 1: Build the test image ──────────────────────────────────────────
  # Compiles the C++ backend and runs the full unit test suite.
  # The build fails here if any test fails — the production image is never built.
  - name: "gcr.io/cloud-builders/docker"
    id: build-test-image
    args:
      - build
      - --target=test
      - --tag=weathergraph:test-${SHORT_SHA}
      # Pull the previous test image to use as a layer cache
      - --cache-from=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:test-cache
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - .
    env:
      - "DOCKER_BUILDKIT=1"

  # ─── Step 2: Push the test-cache image ─────────────────────────────────────
  # Persists the builder layers for the next run's --cache-from.
  - name: "gcr.io/cloud-builders/docker"
    id: push-test-cache
    waitFor: ["build-test-image"]
    args:
      - tag
      - weathergraph:test-${SHORT_SHA}
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:test-cache

  - name: "gcr.io/cloud-builders/docker"
    id: push-test-cache-upload
    waitFor: ["push-test-cache"]
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:test-cache

  # ─── Step 3: Build the production image ────────────────────────────────────
  # Only reached if tests passed in Step 1.
  - name: "gcr.io/cloud-builders/docker"
    id: build-production-image
    waitFor: ["build-test-image"]
    args:
      - build
      - --target=production
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${SHORT_SHA}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest
      - --cache-from=weathergraph:test-${SHORT_SHA}
      - --build-arg=BUILDKIT_INLINE_CACHE=1
      - .
    env:
      - "DOCKER_BUILDKIT=1"

  # ─── Step 4: Push production image to Artifact Registry ────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: push-production-image
    waitFor: ["build-production-image"]
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}

# Images to register with Cloud Build (enables vulnerability scanning)
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:latest"

# Substitution defaults (override per trigger or via --substitutions)
substitutions:
  _REGION: us-central1
  _REPO: weathergraph
  _IMAGE: weathergraph

options:
  # E2_HIGHCPU_8 gives 8 vCPUs for parallel CMake builds, keeping costs low
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true

# Build timeout: 20 min covers ONNX Runtime download + C++ compile + tests
timeout: 1200s
