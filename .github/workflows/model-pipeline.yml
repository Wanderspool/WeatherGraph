# ==============================================================================
# WeatherGraph — Reusable Model CI Pipeline
#
# Validates the engine against any ONNX model — pre-built or freshly converted.
#
# ── How scientists use this ───────────────────────────────────────────────────
#
# From your own repository's workflow, call this pipeline and tell it where
# your model comes from. Two source modes:
#
#   onnx   — provide a URL to a pre-built .onnx file
#   script — provide a path to a Python script that produces the .onnx
#            (the script must accept --output <path>)
#
# Example: validate a HuggingFace model
#
#   jobs:
#     validate:
#       uses: Wanderspool/WeatherGraph/.github/workflows/model-pipeline.yml@main
#       with:
#         model-source: onnx
#         model-url: https://huggingface.co/Wanderspool/Keisler_2022/resolve/main/keisler_2022.onnx
#
# Example: convert from PyTorch and validate
#
#   jobs:
#     validate:
#       uses: Wanderspool/WeatherGraph/.github/workflows/model-pipeline.yml@main
#       with:
#         model-source: script
#         model-script: scripts/export_pytorch.py
#         model-script-args: '--checkpoint weights/my_model.pt'
#         model-pip-requirements: 'torch==2.3.0'
#         disable-cpu-mem-arena: true
#         disable-mem-pattern: true
#
# Example: build the prototype latent-output graph from the repo's own extractor scripts
#
#   jobs:
#     validate:
#       uses: Wanderspool/WeatherGraph/.github/workflows/model-pipeline.yml@main
#       with:
#         model-source: script
#         model-script: exporter/build_gnn_graph.py
#         model-pip-requirements: 'numpy onnx onnxscript'
#         allow-prototype-exporter: true
#
# ── Manual dispatch ───────────────────────────────────────────────────────────
# You can also trigger this directly from the GitHub Actions UI or gh CLI:
#
#   gh workflow run model-pipeline.yml \
#     -f model-source=onnx \
#     -f model-url=https://huggingface.co/Wanderspool/Keisler_2022/resolve/main/keisler_2022.onnx
# ==============================================================================
name: Model CI Pipeline

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to use
        required: false
        default: '3.11'
        type: string
      model-source:
        description: '"onnx" (provide model-url) or "script" (provide model-script)'
        required: false
        default: 'onnx'
        type: string
      model-url:
        description: Pre-built ONNX download URL (when model-source is "onnx")
        required: false
        default: 'https://huggingface.co/Wanderspool/Keisler_2022/resolve/main/keisler_2022.onnx'
        type: string
      model-script:
        description: Repo-relative path to a conversion script (when model-source is "script")
        required: false
        default: ''
        type: string
      model-script-args:
        description: Extra CLI arguments for the conversion script
        required: false
        default: ''
        type: string
      model-pip-requirements:
        description: Space-separated pip packages required by the conversion script
        required: false
        default: ''
        type: string
      intra-op-threads:
        description: ONNX Runtime intra-op thread count for runtime smoke validation
        required: false
        default: 1
        type: number
      disable-cpu-mem-arena:
        description: Disable the ONNX Runtime CPU arena allocator during runtime smoke validation
        required: false
        default: false
        type: boolean
      disable-mem-pattern:
        description: Disable ONNX Runtime memory-pattern reuse during runtime smoke validation
        required: false
        default: false
        type: boolean
      spatial-tiling:
        description: Enable exact graph-aware tiled runtime smoke validation
        required: false
        default: false
        type: boolean
      tile-bundle-path:
        description: Repo-relative path to a tile-bundle manifest or directory
        required: false
        default: ''
        type: string
      allow-prototype-exporter:
        description: Allow prototype latent-output exporters such as exporter/build_gnn_graph.py
        required: false
        default: false
        type: boolean
      extra-test-args:
        description: Extra pytest arguments appended to the test run
        required: false
        default: ''
        type: string

  workflow_dispatch:
    inputs:
      model-source:
        description: Model source
        required: true
        default: 'onnx'
        type: choice
        options: [onnx, script]
      model-url:
        description: >
          Pre-built ONNX download URL.
          Used when model-source = "onnx".
          Default points to the reference 2022 ONNX on HuggingFace.
        required: false
        default: 'https://huggingface.co/Wanderspool/Keisler_2022/resolve/main/keisler_2022.onnx'
        type: string
      model-script:
        description: >
          Repo-relative path to a Python conversion script.
          Used when model-source = "script".
          The script must accept --output <path>.
        required: false
        default: ''
        type: string
      model-script-args:
        description: Extra CLI arguments for the conversion script
        required: false
        default: ''
        type: string
      model-pip-requirements:
        description: Space-separated pip packages required by the script
        required: false
        default: ''
        type: string
      intra-op-threads:
        description: ONNX Runtime intra-op thread count for runtime smoke validation
        required: false
        default: 1
        type: number
      disable-cpu-mem-arena:
        description: Disable the ONNX Runtime CPU arena allocator during runtime smoke validation
        required: false
        default: false
        type: boolean
      disable-mem-pattern:
        description: Disable ONNX Runtime memory-pattern reuse during runtime smoke validation
        required: false
        default: false
        type: boolean
      spatial-tiling:
        description: Enable exact graph-aware tiled runtime smoke validation
        required: false
        default: false
        type: boolean
      tile-bundle-path:
        description: Repo-relative path to a tile-bundle manifest or directory
        required: false
        default: ''
        type: string
      allow-prototype-exporter:
        description: Allow prototype latent-output exporters such as exporter/build_gnn_graph.py
        required: false
        default: false
        type: boolean

env:
  ONNXRUNTIME_VERSION: '1.18.0'

jobs:
  model-ci:
    name: "[${{ inputs.model-source }}] Build → Convert → Test"
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # LFS is required when using exporter/build_gnn_graph.py — the
          # data/weights/*.npy and data/graph_data/ files are Git LFS objects.
          lfs: true

      - name: Set up Python ${{ inputs.python-version || '3.11' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.11' }}

      - name: Install Python runtime dependencies
        run: |
          pip install --quiet \
            numpy xarray pandas dask netCDF4 \
            pytest psutil memory-profiler onnx

      # ── Build the C++ engine ─────────────────────────────────────────────────
      - name: Build WeatherGraph engine
        id: engine
        uses: ./.github/actions/setup-weathergraph
        with:
          onnxruntime-version: ${{ env.ONNXRUNTIME_VERSION }}

      # ── Acquire / convert the model ──────────────────────────────────────────
      - name: Prepare model
        id: model
        uses: ./.github/actions/prepare-model
        with:
          source: ${{ inputs.model-source }}
          url: ${{ inputs.model-url }}
          script: ${{ inputs.model-script }}
          script-args: ${{ inputs.model-script-args }}
          pip-requirements: ${{ inputs.model-pip-requirements }}
          allow-prototype-exporter: ${{ inputs.allow-prototype-exporter }}
          output-path: models/weather_gnn.onnx

      - name: Validate runtime configuration
        env:
          PYTHONPATH: .
          LD_LIBRARY_PATH: ${{ steps.engine.outputs.core-dir }}
          WEATHERGRAPH_ONNX_MODEL: ${{ steps.model.outputs.model-path }}
          WEATHERGRAPH_INTRA_OP_THREADS: ${{ inputs.intra-op-threads }}
          WEATHERGRAPH_DISABLE_CPU_MEM_ARENA: ${{ inputs.disable-cpu-mem-arena }}
          WEATHERGRAPH_DISABLE_MEM_PATTERN: ${{ inputs.disable-mem-pattern }}
          WEATHERGRAPH_SPATIAL_TILING: ${{ inputs.spatial-tiling }}
          WEATHERGRAPH_TILE_BUNDLE_PATH: ${{ inputs.tile-bundle-path }}
        run: |
          python - <<'PY'
          import os
          from weathergraph import WeatherGraphModel

          kwargs = dict(
              model_path=os.environ["WEATHERGRAPH_ONNX_MODEL"],
              weights_dir="data",
              intra_op_threads=int(os.environ["WEATHERGRAPH_INTRA_OP_THREADS"]),
              disable_cpu_mem_arena=os.environ["WEATHERGRAPH_DISABLE_CPU_MEM_ARENA"].lower() == "true",
              disable_mem_pattern=os.environ["WEATHERGRAPH_DISABLE_MEM_PATTERN"].lower() == "true",
              spatial_tiling=os.environ["WEATHERGRAPH_SPATIAL_TILING"].lower() == "true",
              tile_bundle_path=os.environ["WEATHERGRAPH_TILE_BUNDLE_PATH"] or None,
          )
          model = WeatherGraphModel(**kwargs)
          print("[runtime] output_shape=", model.output_shape)
          print("[runtime] cpu_mem_arena_enabled=", model.cpu_mem_arena_enabled)
          print("[runtime] mem_pattern_enabled=", model.mem_pattern_enabled)
          PY

      # ── Run test suite ───────────────────────────────────────────────────────
      - name: Run test suite
        env:
          PYTHONPATH: .
          LD_LIBRARY_PATH: ${{ steps.engine.outputs.core-dir }}
          WEATHERGRAPH_ONNX_MODEL: ${{ steps.model.outputs.model-path }}
          WEATHERGRAPH_INTRA_OP_THREADS: ${{ inputs.intra-op-threads }}
          WEATHERGRAPH_DISABLE_CPU_MEM_ARENA: ${{ inputs.disable-cpu-mem-arena }}
          WEATHERGRAPH_DISABLE_MEM_PATTERN: ${{ inputs.disable-mem-pattern }}
          WEATHERGRAPH_SPATIAL_TILING: ${{ inputs.spatial-tiling }}
          WEATHERGRAPH_TILE_BUNDLE_PATH: ${{ inputs.tile-bundle-path }}
        run: |
          pytest \
            tests/test_cpp_backend.py \
            tests/test_memory_leak.py \
            -v --tb=short --junit-xml=test-results.xml \
            ${{ inputs.extra-test-args || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.model-source }}-${{ github.run_id }}
          path: test-results.xml
          retention-days: 7
