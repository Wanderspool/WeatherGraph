[build-system]
requires = ["scikit-build-core>=0.10.0", "pybind11>=2.13.0"]
build-backend = "scikit_build_core.build"

[project]
name = "keisler-engine"
version = "0.1.0"
description = "High-performance C++/ONNX weather prediction engine"
readme = "README.md"
authors = [{ name = "Keisler Engine Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "xarray>=2023.0.0",
    "pandas>=2.0.0",
    "dask>=2023.0.0",
    "netCDF4>=1.6.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "psutil>=5.9.0",
    "memory-profiler>=0.61.0"
]

[tool.scikit-build]
cmake.args = ["-DCMAKE_BUILD_TYPE=Release"]
wheel.expand-macos-universal_tags = true
install.components = ["python_modules"]
